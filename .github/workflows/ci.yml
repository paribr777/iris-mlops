name: CI - Iris MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3. Install dependencies and create venv
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install gcsfs dvc[gs] mlflow scikit-learn pandas joblib pytest

      # 4. Authenticate to GCP using secret key
      - name: Authenticate to GCP
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp_key.json
          gcloud auth activate-service-account --key-file=gcp_key.json
          gcloud config set project striking-gadget-473408-b7

      # 5. Pull DVC data
      - name: Pull DVC data
        run: |
          source venv/bin/activate
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp_key.json
          dvc pull

      # 6. Reproduce DVC pipeline
      - name: Reproduce pipeline
        run: |
          source venv/bin/activate
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp_key.json
          dvc repro

      # 7. Evaluate latest model
      - name: Evaluate model
        run: |
          source venv/bin/activate
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp_key.json
          python eval.py

      # 8. Run pytest for inference script integrity
      - name: Run tests
        run: |
          source venv/bin/activate
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp_key.json
          pytest tests/


name: CI - Iris MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Path for GCP credentials
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json

    defaults:
      run:
        shell: bash -l {0}

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3. Install dependencies and activate virtual environment
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]" gcsfs mlflow scikit-learn pandas joblib pytest

      # 4. Authenticate with GCP using service account
      - name: Authenticate to GCP
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > gcp_key.json
          gcloud auth activate-service-account --key-file=gcp_key.json
          gcloud config set project striking-gadget-473408-b7

      # 5. Pull DVC data and models
      - name: DVC Pull
        run: |
          source venv/bin/activate
          dvc pull -v

      # 6. Reproduce DVC pipeline (all stages)
      - name: Reproduce DVC pipeline
        run: |
          source venv/bin/activate
          dvc repro -v

      # 7. Evaluate latest model
      - name: Evaluate model
        run: |
          source venv/bin/activate
          python eval.py

      # 8. Run tests to ensure inference script integrity
      - name: Run tests
        run: |
          source venv/bin/activate
          pytest tests/ --maxfail=1 --disable-warnings -q

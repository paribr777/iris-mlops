name: CI - Iris MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install gcsfs dvc[gs] mlflow scikit-learn pandas joblib pytest

      - name: Authenticate to GCP
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > gcp_key.json
          gcloud auth activate-service-account --key-file=gcp_key.json
          gcloud config set project striking-gadget-473408-b7

      - name: Pull DVC data
        run: |
          source venv/bin/activate
          dvc pull

      - name: Reproduce pipeline
        run: |
          source venv/bin/activate
          dvc repro

      - name: Run tests
        run: |
          source venv/bin/activate
          pytest tests/

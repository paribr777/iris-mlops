name: CI - Iris MLOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3. Authenticate to GCP
      - name: Authenticate to GCP
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/gcp_key.json"
          gcloud auth activate-service-account --key-file=gcp_key.json
          gcloud config set project striking-gadget-473408-b7

      # 4. Set up virtual environment and install dependencies
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[gs] gcsfs mlflow scikit-learn pandas joblib pytest

      # 5. Pull DVC datasets and outputs
      - name: Pull DVC data
        run: |
          source venv/bin/activate
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/gcp_key.json"
          dvc pull --force

      # 6. Reproduce DVC pipeline (incremental training)
      - name: Reproduce pipeline
        run: |
          source venv/bin/activate
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/gcp_key.json"
          dvc repro

      # 7. Evaluate latest model
      - name: Evaluate model
        run: |
          source venv/bin/activate
          python eval.py

      # 8. Run pytest for inference script integrity
      - name: Run tests
        run: |
          source venv/bin/activate
          pytest tests/
